# Dependency updates. Grouped so the repo gets one PR per ecosystem per week, never auto-merged.
# Deploy freeze (judging, Dec 1–15): review and merge nothing that is not a security fix.
version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml is supported by the npm ecosystem
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: generated by APIMatic and audited with the Context Plugin (docs/apimatic-context-plugin.md).
      - dependency-name: "@paypal/paypal-server-sdk"
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
