name: keep-demo-awake
# The public demo runs on Render's free tier, which sleeps after 15 idle minutes (cold start ~1 min, in-memory state lost).
# Judges evaluate between Dec 1 and Dec 15 at random times, so we ping the health endpoint every 10 minutes.
# One always-on free instance stays within Render's 750 free hours/month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://paylet.onrender.com/api/health || true
